<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - KINETIC</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-surface vh-100 overflow-hidden d-flex flex-column" style="padding-top: 0 !important;">

<!-- HEADER -->
<header class="bg-white border-bottom border-secondary-subtle px-4 py-3 d-flex justify-content-between align-items-center shadow-sm z-3">
    <div class="d-flex align-items-center gap-4">
        <a class="text-decoration-none font-headline fs-4 fst-italic text-dark fw-bold" href="index.html">KINETIC <span class="badge bg-dark fs-6 fst-normal align-middle ms-2">ADMIN</span></a>
    </div>
    <div class="d-flex align-items-center gap-3">
        <span class="text-secondary small fw-bold" id="admin-name">Admin</span>
        <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="Auth.logout()">Logout</button>
    </div>
</header>

<!-- MAIN LAYOUT -->
<div class="container-fluid flex-grow-1 overflow-hidden p-0 d-flex flex-column flex-lg-row">
    
    <!-- SIDEBAR -->
    <div class="col-12 col-lg-2 bg-white d-flex flex-column h-100 border-end border-secondary-subtle">
        <div class="list-group list-group-flush pt-4">
            <a href="admin_dashboard_stats.html" class="list-group-item list-group-item-action py-3 font-headline tracking-wide text-uppercase border-0 rounded-end-pill me-3 text-secondary my-1">Dashboard</a>
            <a href="admin_product_management.html" class="list-group-item list-group-item-action py-3 font-headline tracking-wide text-uppercase border-0 rounded-end-pill me-3 bg-dark text-white shadow-sm fw-bold active">Products</a>
            <a href="admin_user_management.html" class="list-group-item list-group-item-action py-3 font-headline tracking-wide text-uppercase border-0 rounded-end-pill me-3 text-secondary my-1">Users / Roles</a>
        </div>
    </div>

    <!-- CONTENT -->
    <div class="col-12 col-lg-10 bg-surface-low p-4 p-md-5 overflow-auto">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h1 class="font-headline fs-3 fw-bold mb-0">Products Catalog</h1>
            <button class="btn btn-dark rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#productModal">+ Add Product</button>
        </div>

        <div class="bg-white rounded-4 shadow-sm border border-secondary-subtle p-0 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 text-nowrap">
                    <thead class="bg-surface-low text-secondary font-headline small text-uppercase">
                        <tr>
                            <th class="py-3 px-4">Product</th>
                            <th class="py-3">Category</th>
                            <th class="py-3">Price</th>
                            <th class="py-3">Tags</th>
                            <th class="py-3 text-end px-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-product-table">
                        <!-- Injected via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Product Modal -->
<div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow-lg rounded-4">
      <div class="modal-header border-0 pb-0 pt-4 px-4">
        <h5 class="modal-title font-headline fw-bold">Add/Edit Product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
          <form id="product-form">
              <div class="row g-3">
                  <div class="col-12">
                      <label class="form-label small text-secondary fw-bold text-uppercase font-headline">Product Title</label>
                      <input type="text" class="form-control bg-surface border-0" id="p-title" required>
                  </div>
                  <div class="col-md-6">
                      <label class="form-label small text-secondary fw-bold text-uppercase font-headline">Category</label>
                      <select class="form-select bg-surface border-0" id="p-category">
                          <option>Running</option>
                          <option>Training</option>
                          <option>Lifestyle</option>
                          <option>Trail</option>
                      </select>
                  </div>
                  <div class="col-md-6">
                      <label class="form-label small text-secondary fw-bold text-uppercase font-headline">Price ($)</label>
                      <input type="number" step="0.01" class="form-control bg-surface border-0" id="p-price" required>
                  </div>
                  <div class="col-12">
                      <label class="form-label small text-secondary fw-bold text-uppercase font-headline">Image (Upload Mock)</label>
                      <input type="file" class="form-control bg-surface border-0" id="p-image">
                  </div>
                  <div class="col-12 mt-4 text-end">
                      <button type="button" class="btn btn-light me-2" data-bs-dismiss="modal">Cancel</button>
                      <button type="submit" class="btn btn-dark px-4">Save Product</button>
                  </div>
              </div>
          </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/auth.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        Auth.requireRole('admin');
        const user = Auth.getCurrentUser();
        document.getElementById('admin-name').textContent = user.name;

        // Render Table
        function renderTable() {
            const products = window.db.getProducts();
            const tbody = document.getElementById('admin-product-table');
            tbody.innerHTML = '';
            products.forEach(p => {
                const tagsHtml = p.tags.map(t => `<span class="badge bg-secondary me-1">${t}</span>`).join('');
                tbody.innerHTML += `
                    <tr>
                        <td class="px-4">
                            <div class="d-flex align-items-center gap-3">
                                <img src="${p.image}" class="img-thumbnail border-0 bg-light p-1" style="width: 50px; mix-blend-mode: multiply;">
                                <span class="fw-bold">${p.title}</span>
                            </div>
                        </td>
                        <td>${p.category}</td>
                        <td class="fw-bold text-primary">$${p.price}</td>
                        <td>${tagsHtml}</td>
                        <td class="text-end px-4">
                            <button class="btn btn-sm btn-outline-dark rounded-pill px-3">Edit</button>
                            <button class="btn btn-sm btn-outline-danger rounded-pill ms-2" onclick="deleteProduct('${p.id}')">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }
        renderTable();

        document.getElementById('product-form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Mock Saving
            let prods = window.db.getProducts();
            prods.push({
                id: 'p' + Date.now(),
                title: document.getElementById('p-title').value,
                category: document.getElementById('p-category').value,
                price: parseFloat(document.getElementById('p-price').value),
                tags: [],
                image: 'https://lh3.googleusercontent.com/aida-public/AB6AXuDu-RW-5Ztok81Ts88NzzVplXkJC9mon5NF-Rumw_beDVj45vn5xMQwEP-ifOzNpjbTRKfI9NlFx6iJvIZ3vAp1gPXlV1F08qvH-Lj6Qjce0FTJaQDkKSdUzJ6qjZOzdtQFlzWwJDfDl51YCfMwE2eLwXWxF0Sw_EG5MMbgEvRD_a8mRSIZ01GNE2t6tA3vlnxJpzQsVWMkV9MVrJhbbEk48Tv72aq3Paib356MP_Iw9_q1ClW_YS5NeZFj4vC4Pp8-9r9kJb3x1bdn' // fallback
            });
            localStorage.setItem('kinetic_products', JSON.stringify(prods));
            renderTable();
            bootstrap.Modal.getInstance(document.getElementById('productModal')).hide();
            e.target.reset();
        });

        window.deleteProduct = function(id) {
            if(confirm('Are you sure?')) {
                let prods = window.db.getProducts().filter(p => p.id !== id);
                localStorage.setItem('kinetic_products', JSON.stringify(prods));
                renderTable();
            }
        }
    });

</script>
</body>
</html>
