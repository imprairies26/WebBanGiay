<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Terminal - KINETIC</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-surface vh-100 overflow-hidden d-flex flex-column" style="padding-top: 0 !important;">

<!-- HEADER -->
<header class="bg-white border-bottom border-secondary-subtle px-4 py-3 d-flex justify-content-between align-items-center shadow-sm z-3">
    <div class="d-flex align-items-center gap-4">
        <a class="text-decoration-none font-headline fs-4 fst-italic text-dark fw-bold" href="index.html">KINETIC <span class="badge bg-primary fs-6 fst-normal align-middle ms-2">POS</span></a>
    </div>
    <div class="d-flex align-items-center gap-3">
        <span class="text-secondary small fw-bold" id="staff-name">Staff</span>
        <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="Auth.logout()">Logout</button>
    </div>
</header>

<!-- MAIN POS LAYOUT -->
<div class="container-fluid flex-grow-1 overflow-hidden p-0 d-flex flex-column flex-lg-row">
    
    <!-- LEFT: Products Area -->
    <div class="col-12 col-lg-8 bg-surface-low d-flex flex-column h-100 border-end border-secondary-subtle">
        <!-- Search Bar -->
        <div class="p-4 bg-white shadow-sm z-2">
            <div class="position-relative">
                <span class="material-symbols-outlined position-absolute top-50 translate-middle-y ms-3 text-secondary">search</span>
                <input type="text" class="form-control form-control-lg bg-surface-low border-0 ps-5 rounded-pill" id="pos-search" placeholder="Search by name or scan barcode (e.g. Kinetic Aero)...">
            </div>
        </div>

        <!-- Product Grid -->
        <div class="flex-grow-1 overflow-auto p-4">
            <div class="row g-3" id="pos-product-grid">
                <!-- Products via JS -->
            </div>
        </div>
    </div>

    <!-- RIGHT: Cart Area -->
    <div class="col-12 col-lg-4 bg-white d-flex flex-column h-100 shadow position-relative z-3">
        <!-- Cart Header -->
        <div class="p-4 border-bottom border-secondary-subtle d-flex justify-content-between align-items-center">
            <h2 class="font-headline fs-5 fw-bold mb-0">Current Order</h2>
            <button class="btn btn-sm btn-link text-danger text-decoration-none" onclick="Cart.clearCart()">Clear</button>
        </div>

        <!-- Cart Items -->
        <div class="flex-grow-1 overflow-auto bg-surface-low p-2" id="pos-cart-items">
            <!-- Items via JS -->
        </div>

        <!-- Cart Footer / Summary -->
        <div class="p-4 bg-white border-top border-secondary-subtle shadow-lg">
            <div class="d-flex justify-content-between mb-2 text-secondary small">
                <span>Subtotal</span>
                <span id="pos-subtotal">$0.00</span>
            </div>
            <div class="d-flex justify-content-between mb-3 text-secondary small">
                <span>Tax (10%)</span>
                <span id="pos-tax">$0.00</span>
            </div>
            <div class="d-flex justify-content-between font-headline fw-bold fs-4 mb-4">
                <span>Total</span>
                <span id="pos-total" class="text-primary">$0.00</span>
            </div>
            <button class="btn btn-kinetic-primary w-100 py-3 fs-5" id="btn-pay" data-bs-toggle="modal" data-bs-target="#paymentModal">Charge</button>
        </div>
    </div>
</div>

<!-- PAYMENT MODAL -->
<div class="modal fade" id="paymentModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
      <div class="modal-header bg-dark text-white border-0 py-4">
        <h5 class="modal-title font-headline fw-bold" id="payModalLabel">Select Payment Method</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-0">
          <div class="d-flex border-bottom">
              <button class="btn flex-fill py-3 rounded-0 fw-bold border-bottom border-3 border-primary bg-light" id="tab-cash" onclick="switchTab('cash')">CASH</button>
              <button class="btn flex-fill py-3 rounded-0 fw-bold border-bottom border-3 border-transparent" id="tab-transfer" onclick="switchTab('transfer')">BANK TRANSFER</button>
          </div>

          <div class="p-4" id="view-cash">
              <h4 class="font-headline text-center fs-2 fw-bold text-primary mb-4" id="modal-total-display">$0.00</h4>
              <label class="form-label font-headline small text-secondary fw-bold">Amount Tendered</label>
              <div class="input-group input-group-lg mb-3">
                  <span class="input-group-text bg-white border-end-0">$</span>
                  <input type="number" class="form-control border-start-0" id="cash-tendered" placeholder="0.00">
              </div>
              <div class="d-flex justify-content-between align-items-center bg-surface-low p-3 rounded text-danger fw-bold fs-5 mb-4">
                  <span>Change Due:</span>
                  <span id="cash-change">$0.00</span>
              </div>
              <button class="btn btn-dark w-100 py-3 font-headline fw-bold" onclick="completePayment('Cash')">Confirm Payment</button>
          </div>

          <div class="p-4 d-none text-center" id="view-transfer">
              <h4 class="font-headline fs-2 fw-bold text-primary mb-2" id="modal-total-display-qr">$0.00</h4>
              <p class="text-secondary small mb-4">Scan QR code via Banking App</p>
              <div class="bg-white p-2 d-inline-block border rounded-3 shadow-sm mb-4">
                  <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=KINETIC-POS-TRANSFER" alt="QR Code">
              </div>
              <button class="btn btn-dark w-100 py-3 font-headline fw-bold mt-2" onclick="completePayment('Bank Transfer')">Verify & Confirm</button>
          </div>

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/cart.js"></script>
<script>
    let currentTotal = 0;

    document.addEventListener('DOMContentLoaded', () => {
        Auth.requireRole('staff');
        document.getElementById('staff-name').textContent = Auth.getCurrentUser().name;

        // Render Products
        const products = window.db.getProducts();
        const grid = document.getElementById('pos-product-grid');
        products.forEach(p => {
            grid.innerHTML += `
                <div class="col-6 col-md-4 col-xl-3">
                    <div class="card h-100 border-0 shadow-sm cursor-pointer hover-lift" onclick="Cart.addItem({id:'${p.id}', title:'${p.title}', price:${p.price}, image:'${p.image}'})" style="cursor:pointer; transition: transform 0.2s;">
                        <div class="bg-surface-lowest p-3 text-center d-flex align-items-center justify-content-center" style="height: 120px;">
                            <img src="${p.image}" class="img-fluid" style="mix-blend-mode: multiply; max-height: 100px;">
                        </div>
                        <div class="card-body p-3">
                            <h6 class="card-title font-headline fw-bold mb-1 text-truncate" style="font-size: 0.9rem;">${p.title}</h6>
                            <p class="card-text text-primary fw-bold m-0">$${p.price}</p>
                        </div>
                    </div>
                </div>
            `;
        });

        // Add CSS for hover-lift
        const style = document.createElement('style');
        style.innerHTML = `.hover-lift:hover { transform: translateY(-5px); box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important; }`;
        document.head.appendChild(style);

        // Render Cart
        function renderPosCart() {
            const items = Cart.getCart();
            const list = document.getElementById('pos-cart-items');
            list.innerHTML = '';
            let sub = 0;
            
            if(items.length === 0) {
                list.innerHTML = '<div class="text-center text-secondary mt-5 small">Scan or select items to begin</div>';
                document.getElementById('btn-pay').disabled = true;
            } else {
                document.getElementById('btn-pay').disabled = false;
                items.forEach(item => {
                    sub += item.price * item.quantity;
                    list.innerHTML += `
                        <div class="bg-white p-3 mb-2 rounded shadow-sm d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center gap-3">
                                <span class="badge bg-secondary rounded-pill px-2 py-1">${item.quantity}</span>
                                <div>
                                    <h6 class="font-headline fw-bold mb-0 text-truncate" style="max-width: 150px;">${item.title}</h6>
                                    <small class="text-secondary">$${item.price} @</small>
                                </div>
                            </div>
                            <div class="text-end">
                                <span class="fw-bold d-block">$${item.price * item.quantity}</span>
                                <button class="btn btn-sm text-danger p-0 mt-1" onclick="Cart.removeItem('${item.id}')"><span class="material-symbols-outlined fs-6">delete</span></button>
                            </div>
                        </div>
                    `;
                });
            }

            const tax = sub * 0.1;
            currentTotal = sub + tax;
            document.getElementById('pos-subtotal').textContent = `$${sub.toFixed(2)}`;
            document.getElementById('pos-tax').textContent = `$${tax.toFixed(2)}`;
            document.getElementById('pos-total').textContent = `$${currentTotal.toFixed(2)}`;
            document.getElementById('modal-total-display').textContent = `$${currentTotal.toFixed(2)}`;
            document.getElementById('modal-total-display-qr').textContent = `$${currentTotal.toFixed(2)}`;
        }

        renderPosCart();
        window.addEventListener('cartUpdated', renderPosCart);

        // Cash Change Logic
        const tenderInput = document.getElementById('cash-tendered');
        const changeOutput = document.getElementById('cash-change');
        tenderInput.addEventListener('input', () => {
            const tendered = parseFloat(tenderInput.value) || 0;
            const change = tendered - currentTotal;
            if (change >= 0) {
                changeOutput.textContent = `$${change.toFixed(2)}`;
                changeOutput.classList.remove('text-danger');
                changeOutput.classList.add('text-success');
            } else {
                changeOutput.textContent = `Insufficient`;
                changeOutput.classList.add('text-danger');
                changeOutput.classList.remove('text-success');
            }
        });
    });

    function switchTab(tab) {
        document.getElementById('tab-cash').className = 'btn flex-fill py-3 rounded-0 fw-bold border-bottom border-3 ' + (tab === 'cash' ? 'border-primary bg-light' : 'border-transparent');
        document.getElementById('tab-transfer').className = 'btn flex-fill py-3 rounded-0 fw-bold border-bottom border-3 ' + (tab === 'transfer' ? 'border-primary bg-light' : 'border-transparent');
        
        document.getElementById('view-cash').classList.toggle('d-none', tab !== 'cash');
        document.getElementById('view-transfer').classList.toggle('d-none', tab !== 'transfer');
    }

    function completePayment(method) {
        if (method === 'Cash') {
            const tendered = parseFloat(document.getElementById('cash-tendered').value) || 0;
            if (tendered < currentTotal) {
                alert('Tendered amount is insufficient.');
                return;
            }
        }
        
        // Process Order
        const orders = window.db.getOrders();
        const newOrder = {
            id: 'POS-' + Math.floor(Math.random() * 100000),
            userEmail: 'Store Walk-in',
            method: method,
            date: new Date().toISOString().split('T')[0],
            total: currentTotal,
            status: 'Completed',
            items: Cart.getCart()
        };
        orders.push(newOrder);
        localStorage.setItem('kinetic_orders', JSON.stringify(orders));
        Cart.clearCart();
        
        // Hide Modal
        bootstrap.Modal.getInstance(document.getElementById('paymentModal')).hide();
        document.getElementById('cash-tendered').value = '';
        
        if(confirm('Payment Successful! Generate E-Invoice?')) {
            const email = prompt("Enter customer email for receipt:");
            if(email) alert(`Receipt sent to ${email}`);
        }
    }
</script>
</body>
</html>
