<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile & Orders - KINETIC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-surface">

<header class="fixed-top glass-nav w-100 px-4 py-3 d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-4">
        <a class="text-decoration-none font-headline fs-4 fst-italic text-dark fw-bold" href="index.html">KINETIC</a>
        <nav class="d-none d-md-flex gap-4 ms-3">
            <a href="index.html" class="nav-kinetic-link">Shop</a>
            <a href="pos_sales_terminal.html" class="nav-kinetic-link">POS</a>
            <a href="admin_dashboard_stats.html" class="nav-kinetic-link">Admin</a>
            <a href="user_profile_orders.html" id="profile-nav-link" class="nav-kinetic-link active">Profile</a>
            <a href="#" onclick="Auth.logout()" class="nav-kinetic-link text-danger">Logout</a>
        </nav>
    </div>
    <div class="d-flex align-items-center gap-3">
        <a href="user_shopping_cart.html" class="btn btn-link text-secondary p-0 border-0 position-relative">
            <span class="material-symbols-outlined fs-4">shopping_bag</span>
            <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.65rem;"></span>
        </a>
    </div>
</header>

<div class="container py-5 mt-5" style="max-width: 1000px;">
    <h1 class="font-headline fs-2 fw-bold mb-5">Your Profile</h1>

    <div class="row g-5">
        <!-- Sidebar Profile -->
        <div class="col-12 col-md-4">
            <div class="bg-surface-lowest p-4 rounded-3 text-center mb-4">
                <div class="position-relative d-inline-block mb-3 cursor-pointer" onclick="document.getElementById('avatar-upload').click()">
                    <img src="https://ui-avatars.com/api/?name=User&background=a83900&color=fff&size=120" id="profile-avatar" class="rounded-circle img-thumbnail border-0 shadow-sm" style="width:120px; height:120px; object-fit:cover;">
                    <div class="position-absolute bottom-0 end-0 bg-white rounded-circle shadow-sm p-2 d-flex align-items-center justify-content-center" style="width:36px; height:36px;">
                        <span class="material-symbols-outlined text-primary fs-6">cloud_upload</span>
                    </div>
                </div>
                <input type="file" id="avatar-upload" class="d-none" accept="image/*">
                <h3 class="font-headline fs-5 fw-bold mb-1" id="profile-name">Loading...</h3>
                <p class="text-secondary small mb-0" id="profile-email">...</p>
                <button class="btn btn-sm btn-outline-secondary rounded-pill mt-3 px-4">Edit Profile</button>
            </div>
            
            <div class="list-group list-group-flush bg-surface-lowest rounded-3 overflow-hidden">
                <a href="#" class="list-group-item list-group-item-action py-3 fw-bold bg-light">Order History</a>
                <a href="#" class="list-group-item list-group-item-action py-3">Addresses</a>
                <a href="#" class="list-group-item list-group-item-action py-3">Payment Methods</a>
            </div>
        </div>

        <!-- Orders List -->
        <div class="col-12 col-md-8">
            <h2 class="font-headline fs-4 fw-bold mb-4">Order History</h2>
            <div id="orders-container">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/cart.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        Auth.requireLogin();
        const user = Auth.getCurrentUser();
        
        document.getElementById('profile-name').textContent = user.name;
        document.getElementById('profile-email').textContent = user.email;
        document.getElementById('profile-avatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=a83900&color=fff&size=120`;

        // Mock cloud upload
        document.getElementById('avatar-upload').addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                alert('Mock Cloud Upload: Avatar uploaded successfully!');
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (evt) => {
                    document.getElementById('profile-avatar').src = evt.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        const orders = window.db.getOrders().filter(o => o.userEmail === user.email);
        const container = document.getElementById('orders-container');

        if(orders.length === 0) {
            container.innerHTML = `<div class="bg-surface-lowest p-5 text-center text-secondary rounded-3">You haven't placed any orders yet.</div>`;
        } else {
            // Reverse so newest is first
            orders.reverse().forEach(o => {
                const itemsHtml = o.items.map(i => `
                    <div class="d-flex align-items-center gap-3 mt-3">
                        <img src="${i.image}" style="width: 40px; mix-blend-mode: multiply;" class="rounded bg-light">
                        <div class="flex-grow-1">
                            <span class="d-block small fw-bold">${i.title}</span>
                            <span class="d-block small text-secondary">Qty: ${i.quantity}</span>
                        </div>
                    </div>
                `).join('');

                container.innerHTML += `
                    <div class="bg-surface-lowest p-4 rounded-3 mb-4 shadow-sm">
                        <div class="d-flex justify-content-between align-items-center mb-3 pb-3 border-bottom border-light">
                            <div>
                                <span class="d-block small text-secondary">Order ${o.id}</span>
                                <span class="d-block fw-bold">${o.date}</span>
                            </div>
                            <div class="text-end">
                                <span class="badge ${o.status === 'Processing' ? 'bg-warning text-dark' : 'bg-success'} rounded-pill px-3 py-2 lh-1">${o.status}</span>
                                <span class="d-block fw-bold fs-5 mt-1">$${o.total.toFixed(2)}</span>
                            </div>
                        </div>
                        <div>${itemsHtml}</div>
                        <div class="mt-4 pt-3 text-end">
                            <button class="btn btn-sm btn-outline-dark rounded-pill px-4">View Invoice</button>
                        </div>
                    </div>
                `;
            });
        }
    });

</script>
</body>
</html>
