<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - KINETIC</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-surface">

<!-- HEADER -->
<header class="fixed-top glass-nav w-100 px-4 py-3 d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-4">
        <a class="text-decoration-none font-headline fs-4 fst-italic text-dark fw-bold" href="index.html">KINETIC</a>
    </div>
    <div class="d-flex align-items-center gap-3">
        <a href="index.html" class="btn btn-link text-secondary text-decoration-none font-headline small text-uppercase">Continue Shopping</a>
    </div>
</header>

<div class="container-fluid max-width-1440 py-5 px-4 mt-5">
    <h1 class="font-headline fs-2 fw-bold mb-5">Your Bag</h1>

    <div class="row g-5">
        <!-- Cart Items -->
        <div class="col-12 col-lg-8" id="cart-items-container">
            <!-- Dynamic elements will be inserted here -->
        </div>

        <!-- Summary Summary -->
        <div class="col-12 col-lg-4">
            <div class="bg-surface-lowest p-4 rounded-3 sticky-top" style="top: 100px;">
                <h3 class="font-headline fs-5 fw-bold mb-4">Summary</h3>
                
                <div class="d-flex justify-content-between mb-3 text-secondary">
                    <span>Subtotal</span>
                    <span id="summary-subtotal">$0.00</span>
                </div>
                <div class="d-flex justify-content-between mb-3 text-secondary">
                    <span>Estimated Shipping</span>
                    <span>$0.00</span>
                </div>
                <div class="d-flex justify-content-between mb-4 text-secondary">
                    <span>Tax</span>
                    <span>Calculated at checkout</span>
                </div>
                
                <hr class="border-secondary-subtle mb-4">
                
                <div class="d-flex justify-content-between mb-4 font-headline fw-bold fs-5">
                    <span>Total</span>
                    <span id="summary-total">$0.00</span>
                </div>

                <a href="user_checkout.html" class="btn btn-kinetic-primary w-100 py-3 mt-2" id="btn-checkout">Go to Checkout</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/cart.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        Auth.requireLogin();
        
        const container = document.getElementById('cart-items-container');
        const subtotalEl = document.getElementById('summary-subtotal');
        const totalEl = document.getElementById('summary-total');
        const btnCheckout = document.getElementById('btn-checkout');

        function renderCart() {
            const items = Cart.getCart();
            container.innerHTML = '';
            let total = 0;

            if (items.length === 0) {
                container.innerHTML = '<p class="text-secondary">Your bag is empty.</p>';
                btnCheckout.classList.add('disabled');
            } else {
                btnCheckout.classList.remove('disabled');
                
                items.forEach(item => {
                    total += (item.price * item.quantity);
                    container.innerHTML += `
                        <div class="d-flex flex-column flex-md-row gap-4 align-items-center bg-surface-lowest p-4 rounded-3 mb-3 relative">
                            <div class="bg-surface d-flex align-items-center justify-content-center rounded-3 p-3" style="width: 120px; height: 120px;">
                                <img src="${item.image}" alt="${item.title}" class="img-fluid" style="mix-blend-mode: multiply;">
                            </div>
                            <div class="flex-grow-1">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <h4 class="font-headline fs-5 fw-bold mb-0">${item.title}</h4>
                                    <span class="fw-bold">$${item.price}</span>
                                </div>
                                <p class="text-secondary small mb-3">${item.category}</p>
                                <div class="d-flex justify-content-between align-items-center">
                                    <div class="d-flex align-items-center border rounded-pill px-3 py-1">
                                        <button class="btn btn-sm btn-link text-dark text-decoration-none" onclick="Cart.updateQuantity('${item.id}', ${item.quantity - 1})">-</button>
                                        <span class="mx-3 fw-bold">${item.quantity}</span>
                                        <button class="btn btn-sm btn-link text-dark text-decoration-none" onclick="Cart.updateQuantity('${item.id}', ${item.quantity + 1})">+</button>
                                    </div>
                                    <button class="btn btn-link text-secondary p-0 text-decoration-underline small" onclick="Cart.removeItem('${item.id}')">Remove</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            subtotalEl.textContent = `$${total.toFixed(2)}`;
            totalEl.textContent = `$${total.toFixed(2)}`;
        }

        renderCart();
        window.addEventListener('cartUpdated', renderCart);
    });
</script>
</body>
</html>
