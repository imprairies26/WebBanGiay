<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - KINETIC</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-surface">

<header class="fixed-top glass-nav w-100 px-4 py-3 d-flex justify-content-center align-items-center">
    <a class="text-decoration-none font-headline fs-4 fst-italic text-dark fw-bold" href="index.html">KINETIC</a>
</header>

<div class="container py-5 mt-5" style="max-width: 1200px;">
    <div class="row g-5">
        
        <!-- Left Column: Forms -->
        <div class="col-12 col-lg-7">
            <h2 class="font-headline fs-5 fw-bold mb-4">Contact Information</h2>
            <div class="mb-5">
                <input type="email" class="form-control bg-transparent border-0 border-bottom border-secondary-subtle px-0 py-2 rounded-0 mb-3" placeholder="Email address" id="checkout-email" required>
            </div>

            <h2 class="font-headline fs-5 fw-bold mb-4">Shipping Address</h2>
            <div class="row g-3 mb-5">
                <div class="col-sm-6">
                    <input type="text" class="form-control bg-transparent border-0 border-bottom border-secondary-subtle px-0 py-2 rounded-0" placeholder="First name" required>
                </div>
                <div class="col-sm-6">
                    <input type="text" class="form-control bg-transparent border-0 border-bottom border-secondary-subtle px-0 py-2 rounded-0" placeholder="Last name" required>
                </div>
                <div class="col-12">
                    <input type="text" class="form-control bg-transparent border-0 border-bottom border-secondary-subtle px-0 py-2 rounded-0" placeholder="Address" required>
                </div>
                <div class="col-12">
                    <input type="text" class="form-control bg-transparent border-0 border-bottom border-secondary-subtle px-0 py-2 rounded-0" placeholder="Apartment, suite, etc. (optional)">
                </div>
                <div class="col-sm-4">
                    <input type="text" class="form-control bg-transparent border-0 border-bottom border-secondary-subtle px-0 py-2 rounded-0" placeholder="City" required>
                </div>
                <div class="col-sm-4">
                    <input type="text" class="form-control bg-transparent border-0 border-bottom border-secondary-subtle px-0 py-2 rounded-0" placeholder="State/Province" required>
                </div>
                <div class="col-sm-4">
                    <input type="text" class="form-control bg-transparent border-0 border-bottom border-secondary-subtle px-0 py-2 rounded-0" placeholder="ZIP/Postal code" required>
                </div>
            </div>

            <h2 class="font-headline fs-5 fw-bold mb-4">Payment</h2>
            <div class="bg-surface-lowest border border-secondary-subtle rounded-3 p-4 mb-4">
                <div class="form-check mb-3">
                    <input class="form-check-input" type="radio" name="payment" id="pay-card" checked>
                    <label class="form-check-label fw-bold" for="pay-card">Credit or debit card</label>
                </div>
                <div class="mt-3">
                    <input type="text" class="form-control bg-transparent border-0 border-bottom border-secondary-subtle px-0 py-2 rounded-0 mb-3" placeholder="Card number">
                    <div class="row g-3">
                        <div class="col-6">
                            <input type="text" class="form-control bg-transparent border-0 border-bottom border-secondary-subtle px-0 py-2 rounded-0" placeholder="Expiration date (MM/YY)">
                        </div>
                        <div class="col-6">
                            <input type="text" class="form-control bg-transparent border-0 border-bottom border-secondary-subtle px-0 py-2 rounded-0" placeholder="Security code">
                        </div>
                    </div>
                    <input type="text" class="form-control bg-transparent border-0 border-bottom border-secondary-subtle px-0 py-2 rounded-0 mt-3" placeholder="Name on card">
                </div>
            </div>
            
            <button class="btn btn-kinetic-primary w-100 py-3 mt-4 fs-5" id="btn-pay">Pay Now</button>
        </div>

        <!-- Right Column: Order Summary -->
        <div class="col-12 col-lg-5 p-0 p-lg-4 bg-surface-low rounded-3 align-self-start">
            <div class="d-flex flex-column gap-3 mb-4" id="checkout-items">
                <!-- Items -->
            </div>
            
            <div class="d-flex gap-2 mb-4">
                <input type="text" class="form-control bg-transparent border-0 border-bottom border-secondary-subtle px-0 py-2 rounded-0 flex-grow-1" placeholder="Discount code">
                <button class="btn btn-sm btn-dark px-4 rounded-5">Apply</button>
            </div>

            <div class="d-flex justify-content-between mb-2 text-secondary small">
                <span>Subtotal</span>
                <span id="co-subtotal">$0.00</span>
            </div>
            <div class="d-flex justify-content-between mb-3 text-secondary small">
                <span>Shipping</span>
                <span>$0.00</span>
            </div>
            <hr class="border-secondary-subtle">
            <div class="d-flex justify-content-between fw-bold fs-4 align-items-center">
                <span>Total</span>
                <span id="co-total">$0.00</span>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/cart.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        Auth.requireLogin();
        const user = Auth.getCurrentUser();
        document.getElementById('checkout-email').value = user.email;

        const items = Cart.getCart();
        if(items.length === 0) {
            alert('Your cart is empty');
            window.location.href = 'index.html';
            return;
        }

        const container = document.getElementById('checkout-items');
        let total = 0;
        items.forEach(item => {
            total += (item.price * item.quantity);
            container.innerHTML += `
                <div class="d-flex align-items-center gap-3">
                    <div class="position-relative bg-white rounded p-2" style="width: 60px; height: 60px;">
                        <img src="${item.image}" class="img-fluid" style="mix-blend-mode: multiply;">
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-secondary">${item.quantity}</span>
                    </div>
                    <div class="flex-grow-1">
                        <div class="fw-bold fs-6">${item.title}</div>
                        <div class="text-secondary small">Size: 9</div>
                    </div>
                    <div class="fw-bold">$${item.price * item.quantity}</div>
                </div>
            `;
        });
        document.getElementById('co-subtotal').textContent = `$${total.toFixed(2)}`;
        document.getElementById('co-total').textContent = `$${total.toFixed(2)}`;

        document.getElementById('btn-pay').addEventListener('click', () => {
            // Mock payment process
            const orders = window.db.getOrders();
            const newOrder = {
                id: 'ORD-' + Math.floor(Math.random() * 100000),
                userEmail: user.email,
                date: new Date().toISOString().split('T')[0],
                total: total,
                status: 'Processing',
                items: items
            };
            orders.push(newOrder);
            localStorage.setItem('kinetic_orders', JSON.stringify(orders));
            
            Cart.clearCart();
            alert('Payment Successful! Order ID: ' + newOrder.id);
            window.location.href = 'user_profile_orders.html';
        });
    });
</script>
</body>
</html>
