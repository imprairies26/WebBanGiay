<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - KINETIC</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-surface vh-100 overflow-hidden d-flex flex-column" style="padding-top: 0 !important;">

<!-- HEADER -->
<header class="bg-white border-bottom border-secondary-subtle px-4 py-3 d-flex justify-content-between align-items-center shadow-sm z-3">
    <div class="d-flex align-items-center gap-4">
        <a class="text-decoration-none font-headline fs-4 fst-italic text-dark fw-bold" href="index.html">KINETIC <span class="badge bg-dark fs-6 fst-normal align-middle ms-2">ADMIN</span></a>
    </div>
    <div class="d-flex align-items-center gap-3">
        <span class="text-secondary small fw-bold" id="admin-name">Admin</span>
        <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="Auth.logout()">Logout</button>
    </div>
</header>

<!-- MAIN LAYOUT -->
<div class="container-fluid flex-grow-1 overflow-hidden p-0 d-flex flex-column flex-lg-row">
    
    <!-- SIDEBAR -->
    <div class="col-12 col-lg-2 bg-white d-flex flex-column h-100 border-end border-secondary-subtle">
        <div class="list-group list-group-flush pt-4">
            <a href="admin_dashboard_stats.html" class="list-group-item list-group-item-action py-3 font-headline tracking-wide text-uppercase border-0 rounded-end-pill me-3 text-secondary my-1">Dashboard</a>
            <a href="admin_product_management.html" class="list-group-item list-group-item-action py-3 font-headline tracking-wide text-uppercase border-0 rounded-end-pill me-3 text-secondary my-1">Products</a>
            <a href="admin_user_management.html" class="list-group-item list-group-item-action py-3 font-headline tracking-wide text-uppercase border-0 rounded-end-pill me-3 bg-dark text-white fw-bold active shadow-sm">Users / Roles</a>
        </div>
    </div>

    <!-- CONTENT -->
    <div class="col-12 col-lg-10 bg-surface-low p-4 p-md-5 overflow-auto">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h1 class="font-headline fs-3 fw-bold mb-0">System Users</h1>
            <button class="btn btn-dark rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#userModal">+ Add User</button>
        </div>

        <div class="bg-white rounded-4 shadow-sm border border-secondary-subtle p-0 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 text-nowrap">
                    <thead class="bg-surface-low text-secondary font-headline small text-uppercase">
                        <tr>
                            <th class="py-3 px-4">Name</th>
                            <th class="py-3">Email Address</th>
                            <th class="py-3">Role</th>
                            <th class="py-3 text-end px-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-user-table">
                        <!-- Injected via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- User Modal -->
<div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg rounded-4">
      <div class="modal-header border-0 pb-0 pt-4 px-4">
        <h5 class="modal-title font-headline fw-bold">Add/Edit User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
          <form id="user-form">
              <div class="row g-3">
                  <div class="col-12">
                      <label class="form-label small text-secondary fw-bold text-uppercase font-headline">Full Name</label>
                      <input type="text" class="form-control bg-surface border-0" id="u-name" required>
                  </div>
                  <div class="col-12">
                      <label class="form-label small text-secondary fw-bold text-uppercase font-headline">Email</label>
                      <input type="email" class="form-control bg-surface border-0" id="u-email" required>
                  </div>
                  <div class="col-12">
                      <label class="form-label small text-secondary fw-bold text-uppercase font-headline">Password</label>
                      <input type="text" class="form-control bg-surface border-0" id="u-pass" required placeholder="Leave blank to keep existing password">
                  </div>
                  <div class="col-12">
                      <label class="form-label small text-secondary fw-bold text-uppercase font-headline">Role</label>
                      <select class="form-select bg-surface border-0" id="u-role">
                          <option value="user">Customer (User)</option>
                          <option value="staff">Sales Staff (POS)</option>
                          <option value="admin">Administrator</option>
                      </select>
                  </div>
                  <div class="col-12 mt-4 text-end">
                      <button type="button" class="btn btn-light me-2" data-bs-dismiss="modal">Cancel</button>
                      <button type="submit" class="btn btn-dark px-4">Save User</button>
                  </div>
              </div>
          </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/auth.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        Auth.requireRole('admin');
        const user = Auth.getCurrentUser();
        document.getElementById('admin-name').textContent = user.name;

        // Render Table
        function renderTable() {
            const users = window.db.getUsers();
            const tbody = document.getElementById('admin-user-table');
            tbody.innerHTML = '';
            users.forEach(u => {
                let badgeClass = 'bg-secondary';
                if(u.role === 'admin') badgeClass = 'bg-danger';
                if(u.role === 'staff') badgeClass = 'bg-primary';

                tbody.innerHTML += `
                    <tr>
                        <td class="px-4 fw-bold text-dark">${u.name}</td>
                        <td class="text-secondary">${u.email}</td>
                        <td><span class="badge ${badgeClass} text-uppercase">${u.role}</span></td>
                        <td class="text-end px-4">
                            <button class="btn btn-sm btn-outline-danger rounded-pill ms-2" onclick="deleteUser('${u.email}')">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }
        renderTable();

        document.getElementById('user-form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Mock Saving
            let users = window.db.getUsers();
            const uMail = document.getElementById('u-email').value;
            if(users.find(u => u.email === uMail)) {
                alert('Email already exists');
                return;
            }

            users.push({
                email: uMail,
                name: document.getElementById('u-name').value,
                pass: document.getElementById('u-pass').value,
                role: document.getElementById('u-role').value
            });
            localStorage.setItem('kinetic_users', JSON.stringify(users));
            renderTable();
            bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
            e.target.reset();
        });

        window.deleteUser = function(email) {
            if(email === user.email) {
                alert('Cannot delete yourself!');
                return;
            }
            if(confirm('Are you sure you want to delete this user?')) {
                let users = window.db.getUsers().filter(u => u.email !== email);
                localStorage.setItem('kinetic_users', JSON.stringify(users));
                renderTable();
            }
        }
    });

</script>
</body>
</html>
